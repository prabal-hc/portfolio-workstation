# The site is a static export (`output: "export"` in next.config.ts), so Netlify just serves the `out/` folder.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"

# Long-lived caching for the fingerprinted build assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The link-preview card is exported without a file extension: say it is a PNG, or LinkedIn may not show it.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=3600"
